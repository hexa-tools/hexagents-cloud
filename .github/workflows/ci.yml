name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The private package consumes the public harness (unidirectional) via a git
# dependency (`hexagents` from hexa-tools/hexagents, subdirectory src/backend).
# No additional checkout is required — `poetry install` resolves it from git.
jobs:
  quality:
    name: Lint + typecheck (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Cache Poetry env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Ruff lint
        run: poetry run ruff check hexagents_cloud
      - name: Mypy strict
        run: poetry run mypy hexagents_cloud

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Cache Poetry env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Run unit tests
        run: poetry run pytest tests -m 'not integration and not e2e' --tb=short

  coverage:
    name: Coverage (>= 95% on hexagents_cloud)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Cache Poetry env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Coverage report
        run: poetry run pytest tests --cov=hexagents_cloud --cov-report=xml --cov-report=term-missing --cov-fail-under=95
        env:
          COVERAGE_FAIL_UNDER: 95
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  codecov:
    name: Codecov upload
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: coverage.xml
          flags: private
          fail_ci_if_error: false

  cloud-guard:
    name: cloud_guard (architecture purity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cloud_guard scan
        run: python cloud_guard.py --all --root hexagents_cloud
