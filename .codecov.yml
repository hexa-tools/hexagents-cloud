# HexAgents Cloud — Codecov configuration
# The private action layer. Components tracked per layer; the bootstrap
# enforces >= 95% on domain/application/adapters.

comment:
  layout: "reach, diff, flags, components"
  require_changes: false

coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 2%
    patch:
      default:
        target: 95%

component_management:
  individual_components:
    - component_id: domain
      name: Domain
      paths:
        - hexagents_cloud/domain/**
    - component_id: application
      name: Application
      paths:
        - hexagents_cloud/application/**
    - component_id: adapters
      name: Adapters
      paths:
        - hexagents_cloud/adapters/**

ignore:
  - "**/__init__.py"
  - "**/tests/**"
